document.fonts.ready.then(()=>{
  document.querySelectorAll('.fit').forEach(el=>{
    const max = +(el.dataset.max || 1000);

    while (el.scrollWidth > max && fs > 20) { fs -= 2; el.style.fontSize = fs + 'px'; }
  });
  document.body.dataset.ready = '1';
});
