<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; overflow: hidden; }
.canvas {
  position: relative;
  width: 1200px; height: 675px;
  overflow: hidden;
  display: flex; flex-direction: column;
  align-items: flex-start; justify-content: center;
  gap: 20px;
  padding: 0 60px;
  font-family: 'Yu Gothic', 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif;
  font-weight: 900;
  color: #111111;
  text-align: left;
}
.bg {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 60% 40%;
  filter: hue-rotate(11deg) saturate(1.05);
  z-index: 0;
}
.fit { position: relative; z-index: 1; white-space: nowrap; line-height: 1.3; }
.main { letter-spacing: 0.02em; line-height: 1.05; }
</style>
</head>
<body>
<div class="canvas">
  <img class="bg" src="file:///Users/yuka/blog-workspace/assets/chomoand_eyecatch_bg.png">
  <div class="fit top" data-max="62">Perfumeのっちと結婚</div>
  <div class="fit main" data-max="170">渋谷謙人</div>
  <div class="fit bottom" data-max="56">歴代彼女は誰？<br>鈴木えみとの噂も調査！</div>
</div>
<script>
// 各行を横幅いっぱい(1080px)まで拡大する
document.fonts.ready.then(() => {
  for (const el of document.querySelectorAll('.fit')) {
    const max = parseInt(el.dataset.max, 10);
    let size = max;
    el.style.fontSize = size + 'px';
    while (size > 16 && el.getBoundingClientRect().width > 1080) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }
  document.body.dataset.fitted = '1';
});
</script>
</body>
</html>
