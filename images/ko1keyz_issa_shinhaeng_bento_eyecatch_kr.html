<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: 'KoikeyzRounded';
  src: url('file:///C:/Users/s30se/Desktop/blog-workspace/assets/fonts/BlackHanSans-Regular.ttf') format('truetype');
  font-weight: 900;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; overflow: hidden; }
.canvas {
  position: relative;
  width: 1200px; height: 675px;
  background: #f2efe9;
  overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 24px;
  font-family: 'KoikeyzRounded', 'Malgun Gothic', sans-serif;
  font-weight: 900;
  color: #1c1c1c;
  text-align: center;
}
.smoke { position: absolute; border-radius: 50%; filter: blur(80px); }
.fit { position: relative; z-index: 1; white-space: nowrap; line-height: 1.35; }
.main { letter-spacing: 0.02em; line-height: 1.05; }
</style>
</head>
<body>
<div class="canvas">
  <div class="smoke" style="width:528px;height:528px;left:332px;top:112px;background:radial-gradient(circle,rgba(240,150,160,0.95) 0%,transparent 66%);"></div><div class="smoke" style="width:553px;height:553px;left:262px;top:28px;background:radial-gradient(circle,rgba(246,178,130,0.85) 0%,transparent 66%);"></div><div class="smoke" style="width:577px;height:577px;left:341px;top:1px;background:radial-gradient(circle,rgba(196,165,220,0.80) 0%,transparent 66%);"></div><div class="smoke" style="width:478px;height:478px;left:254px;top:94px;background:radial-gradient(circle,rgba(186,214,170,0.70) 0%,transparent 66%);"></div><div class="smoke" style="width:464px;height:464px;left:405px;top:1px;background:radial-gradient(circle,rgba(250,205,205,0.85) 0%,transparent 66%);"></div>
  <div class="fit top" data-max="90">ISSA의 도시락은 츠카다노조?</div>
  <div class="fit main" data-max="200">KO1KEYZ</div>
  <div class="fit bottom" data-max="78">신행과의 우연도 밝혀져!</div>
</div>
<script>
// 各行を横幅いっぱい(1090px)まで拡大する(Canvaテンプレの「文字が画面いっぱい」の質感を再現)
document.fonts.ready.then(() => {
  for (const el of document.querySelectorAll('.fit')) {
    const max = parseInt(el.dataset.max, 10);
    let size = max;
    el.style.fontSize = size + 'px';
    while (size > 20 && el.getBoundingClientRect().width > 1090) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }
  document.body.dataset.fitted = '1';
});
</script>
</body>
</html>
