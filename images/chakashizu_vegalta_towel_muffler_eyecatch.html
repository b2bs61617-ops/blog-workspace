<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@font-face { font-family: 'Rounded'; src: url('file:///C:/Users/s30se/Desktop/blog-workspace/assets/fonts/MPLUSRounded1c-Black.ttf') format('truetype'); font-weight: 900; }


* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Rounded', 'Yu Gothic', sans-serif; font-weight: 900; }
.stage { width: 1200px; height: 630px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
  background: linear-gradient(135deg,#12082b 0%,#2a1160 55%,#150a33 100%); }
.glow { position: absolute; border-radius: 50%; filter: blur(70px); }
.g1 { width: 640px; height: 640px; right: -140px; top: -200px; background: #a487cf; opacity: 0.55; }
.g2 { width: 560px; height: 560px; left: -170px; bottom: -230px; background: #7c4dff; opacity: 0.6; }
.g3 { width: 380px; height: 380px; left: 36%; top: 30%; background: #ffffff; opacity: 0.1; }
.beam { position: absolute; top: -120px; width: 200px; height: 900px; opacity: 0.13; filter: blur(14px);
  background: linear-gradient(to bottom, #fff, transparent 85%); transform-origin: top center; }
.b1 { left: 240px; transform: rotate(24deg); } .b2 { left: 620px; transform: rotate(-16deg); } .b3 { left: 900px; transform: rotate(30deg); }
.dot { position: absolute; border-radius: 50%; background: #fff; opacity: 0.7; box-shadow: 0 0 10px #fff; }
.frame { position: absolute; inset: 18px; border: 3px solid rgba(255,255,255,0.28); border-radius: 26px; }
.ai-bg { position: absolute; top: 0; left: 0; width: 1420px; height: 700px; z-index: 0; }
.floral-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; opacity: 0.4;
  filter: hue-rotate(0deg) saturate(1.02); }
.scrim { position: absolute; inset: 0; z-index: 0;
  background: linear-gradient(135deg, rgba(18,8,43,0.55) 0%, rgba(42,17,96,0.68) 55%, rgba(21,10,51,0.72) 100%); }
.badge { position: relative; z-index: 2; font-size: 44px; letter-spacing: 0.06em; padding: 8px 34px 10px; border-radius: 999px;
  color: #fff; background: #a487cf; 
  box-shadow: 0 6px 24px #a487cf88; }
.title { position: relative; z-index: 2; width: 1060px; text-align: center; line-height: 1.22; letter-spacing: 0.02em;
  color: #fff; text-wrap: balance;
  text-shadow: 0 0 24px rgba(20,8,50,.85), 0 3px 0 rgba(20,8,50,.5); }
.title .w { white-space: nowrap; }
.title mark { color: inherit; background: linear-gradient(transparent 58%, #a487cf 58%, #a487cf 94%, transparent 94%);
  padding: 0 4px; text-shadow: 0 0 24px rgba(20,8,50,.85); }
/* 3行デザイン: 1・3行目は控えめ、2行目だけ特大+メンバーカラーのマーカー */
.l { position: relative; z-index: 2; white-space: nowrap; text-align: center; line-height: 1;
  color: #fff;
  text-shadow: 0 0 22px rgba(20,8,50,.9), 0 3px 0 rgba(20,8,50,.45); }
.l1, .l3 { letter-spacing: 0.05em; opacity: 0.94; }
.l2 { letter-spacing: 0.01em; padding: 0 22px;
  background: linear-gradient(transparent 60%, #a487cf 60%, #a487cf 93%, transparent 93%); }
.l1::before, .l1::after, .l3::before, .l3::after { content: ''; display: inline-block; width: 32px; height: 5px; border-radius: 3px;
  vertical-align: middle; margin: 0 12px; background: #a487cf; box-shadow: 0 0 12px #a487cf; }

.l2 { background: linear-gradient(transparent 60%, #6a3fdbe6 60%, #6a3fdbe6 93%, transparent 93%); }

</style>
</head>
<body>
<div class="stage">
  
  <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div><div class="dot" style="left:96px;top:70px;width:9px;height:9px"></div><div class="dot" style="left:1040px;top:120px;width:7px;height:7px"></div><div class="dot" style="left:180px;top:540px;width:6px;height:6px"></div><div class="dot" style="left:1110px;top:500px;width:10px;height:10px"></div><div class="dot" style="left:600px;top:44px;width:5px;height:5px"></div>
  
  <div class="frame"></div>
  
  <div class="l l1" id="l1">宮近海斗と吉澤閑也がユアスタで巻いた</div><div class="l l2" id="l2">タオルマフラー</div><div class="l l3" id="l3">はどこの？</div>
</div>
<script>
document.fonts.ready.then(() => {
  const [l1, l2, l3] = ['l1', 'l2', 'l3'].map(id => document.getElementById(id));
  const FIT_W = 1130, USABLE_H = 560, GAP = 40;
  // 文字サイズ(max)で並べ、幅超過なら横を詰める(minSx まで)。それでも超えるなら文字自体を小さくする
  const fit = (el, max, minSx, growSx = 1) => {
    el.style.fontSize = max + 'px';
    const w = el.getBoundingClientRect().width;
    let size = max, sx = 1;
    if (w < FIT_W) sx = Math.min(growSx, FIT_W / w);  // 短い行は横にも伸ばして画面を使う(growSx>1のときだけ)
    if (w > FIT_W) {
      sx = FIT_W / w;
      if (sx < minSx) { size = Math.floor(max * FIT_W / (w * minSx)); sx = minSx; }
    }
    el.style.fontSize = size + 'px';
    el.dataset.sx = sx; el.dataset.sy = 1;
    return size;
  };
  const h1 = fit(l1, 112, 0.62), h3 = fit(l3, 112, 0.62);
  const h2 = fit(l2, 230, 0.7, 1.3);
  // 残りの高さを2行目の縦伸ばしで使い切る(最大1.7倍)。elegantは縦長にせず等倍のまま
  const sy = Math.max(1, Math.min(1.7, (USABLE_H - h1 - h3 - GAP * 2) / h2));
  l2.dataset.sy = sy;
  for (const el of [l1, l2, l3]) {
    const size = parseFloat(el.style.fontSize), sy2 = parseFloat(el.dataset.sy);
    el.style.transform = `scale(${el.dataset.sx}, ${sy2})`;
    el.style.margin = (size * (sy2 - 1) / 2) + 'px 0';  // 縦に伸ばした分の場所を確保
  }
  document.querySelector('.stage').style.gap = GAP + 'px';
  document.body.dataset.fitted = '1';
});
</script>
</body>
</html>
