<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: 'KoikeyzRounded';
  src: url('file:///C:/Users/s30se/Desktop/blog-workspace/assets/fonts/BlackHanSans-Regular.ttf') format('truetype');
  font-weight: 900;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 675px; overflow: hidden; }
.canvas {
  position: relative;
  width: 1200px; height: 675px;
  background: #f2efe9;
  overflow: hidden;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 24px;
  font-family: 'KoikeyzRounded', 'Malgun Gothic', sans-serif;
  font-weight: 900;
  color: #1c1c1c;
  text-align: center;
}
.smoke { position: absolute; border-radius: 50%; filter: blur(80px); }
.fit { position: relative; z-index: 1; white-space: nowrap; line-height: 1.35; }
.main { letter-spacing: 0.02em; line-height: 1.05; }
</style>
</head>
<body>
<div class="canvas">
  <div class="smoke" style="width:576px;height:576px;left:379px;top:90px;background:radial-gradient(circle,rgba(240,150,160,0.95) 0%,transparent 66%);"></div><div class="smoke" style="width:513px;height:513px;left:260px;top:-7px;background:radial-gradient(circle,rgba(246,178,130,0.85) 0%,transparent 66%);"></div><div class="smoke" style="width:606px;height:606px;left:397px;top:92px;background:radial-gradient(circle,rgba(196,165,220,0.80) 0%,transparent 66%);"></div><div class="smoke" style="width:578px;height:578px;left:261px;top:124px;background:radial-gradient(circle,rgba(186,214,170,0.70) 0%,transparent 66%);"></div><div class="smoke" style="width:519px;height:519px;left:411px;top:89px;background:radial-gradient(circle,rgba(250,205,205,0.85) 0%,transparent 66%);"></div>
  <div class="fit top" data-max="90">히로타 슈크림 가격은?</div>
  <div class="fit main" data-max="200">KO1KEYZ</div>
  <div class="fit bottom" data-max="78">YOSHIKI도 먹은 그 간식!</div>
</div>
<script>
// 各行を横幅いっぱい(1090px)まで拡大する(Canvaテンプレの「文字が画面いっぱい」の質感を再現)
document.fonts.ready.then(() => {
  for (const el of document.querySelectorAll('.fit')) {
    const max = parseInt(el.dataset.max, 10);
    let size = max;
    el.style.fontSize = size + 'px';
    while (size > 20 && el.getBoundingClientRect().width > 1090) {
      size -= 2;
      el.style.fontSize = size + 'px';
    }
  }
  document.body.dataset.fitted = '1';
});
</script>
</body>
</html>
