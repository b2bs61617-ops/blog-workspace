<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden;
  font-family: 'Yu Gothic', 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif; }
.container {
  width: 1200px; height: 630px;
  background: #f5f0eb;
  position: relative;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 20px;
  overflow: hidden;
}
.blob1 {
  position: absolute; width: 700px; height: 700px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,183,77,0.7) 0%, rgba(239,154,154,0.6) 40%, transparent 70%);
  opacity: 0.55; right: -150px; top: -150px; filter: blur(55px);
}
.blob2 {
  position: absolute; width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,238,88,0.6) 0%, transparent 70%);
  opacity: 0.4; left: -80px; bottom: -80px; filter: blur(40px);
}
.top-text { font-size: 36px; font-weight: 700; color: #2d2d2d; letter-spacing: 0.1em; z-index: 1; }
.name { font-size: 100px; font-weight: 900; color: #1a1a1a; letter-spacing: 0.05em; z-index: 1; text-align: center; line-height: 1.1; }
.emoji-row { font-size: 60px; z-index: 1; letter-spacing: 0.15em; }
.bottom-text { font-size: 38px; font-weight: 700; color: #2d2d2d; letter-spacing: 0.05em; z-index: 1; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div class="container">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="top-text">KO1KEYZ(コイキーズ)</div>
  <div class="name">メンバー絵文字</div>
  <div class="emoji-row">🌟🏃🐉🍎🍀⚾🚀⚽🎀🍰⚡🥔</div>
  <div class="bottom-text">12人分の意味・由来を徹底解説!</div>
</div>
</body>
</html>
