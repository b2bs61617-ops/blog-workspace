<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  font-family: 'Yu Gothic', 'Meiryo', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
}
.container {
  width: 1200px;
  height: 630px;
  background: #f5f0eb;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 22px;
  overflow: hidden;
}
.blob1 {
  position: absolute;
  width: 720px;
  height: 720px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(179,157,219,0.75) 0%, rgba(144,202,249,0.6) 40%, transparent 70%);
  opacity: 0.6;
  right: -160px;
  top: -160px;
  filter: blur(55px);
}
.blob2 {
  position: absolute;
  width: 420px;
  height: 420px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(100,181,246,0.65) 0%, transparent 70%);
  opacity: 0.45;
  left: -90px;
  bottom: -90px;
  filter: blur(45px);
}
.blob3 {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(209,196,233,0.5) 0%, transparent 70%);
  opacity: 0.5;
  left: 350px;
  top: -60px;
  filter: blur(35px);
}
.top-text {
  font-size: 36px;
  font-weight: 700;
  color: #3d3d3d;
  letter-spacing: 0.12em;
  z-index: 1;
}
.name {
  font-size: 112px;
  font-weight: 900;
  color: #1a1a1a;
  letter-spacing: 0.1em;
  z-index: 1;
  text-align: center;
  line-height: 1.05;
}
.bottom-text {
  font-size: 37px;
  font-weight: 700;
  color: #2d2d2d;
  letter-spacing: 0.04em;
  z-index: 1;
  text-align: center;
  line-height: 1.65;
}
</style>
</head>
<body>
<div class="container">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="top-text">AKB48 19期生</div>
  <div class="name">花田 藍衣</div>
  <div class="bottom-text">
    wiki風プロフィール＆経歴は？<br>
    魚さばけるアイドル「めいめい」の全貌！
  </div>
</div>
</body>
</html>
