<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  font-family: 'Yu Gothic', 'Meiryo', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
}
.container {
  width: 1200px;
  height: 630px;
  background: #faf4ed;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 22px;
  overflow: hidden;
}
.blob1 {
  position: absolute;
  width: 750px;
  height: 750px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,183,77,0.75) 0%, rgba(239,154,154,0.55) 40%, transparent 70%);
  opacity: 0.58;
  right: -180px;
  top: -180px;
  filter: blur(60px);
}
.blob2 {
  position: absolute;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,138,101,0.6) 0%, transparent 70%);
  opacity: 0.42;
  left: -80px;
  bottom: -80px;
  filter: blur(45px);
}
.blob3 {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,204,128,0.6) 0%, transparent 70%);
  opacity: 0.5;
  left: 300px;
  top: -40px;
  filter: blur(35px);
}
.top-text {
  font-size: 36px;
  font-weight: 700;
  color: #3d3d3d;
  letter-spacing: 0.12em;
  z-index: 1;
}
.name {
  font-size: 112px;
  font-weight: 900;
  color: #1a1a1a;
  letter-spacing: 0.1em;
  z-index: 1;
  text-align: center;
  line-height: 1.05;
}
.bottom-text {
  font-size: 37px;
  font-weight: 700;
  color: #2d2d2d;
  letter-spacing: 0.04em;
  z-index: 1;
  text-align: center;
  line-height: 1.65;
}
</style>
</head>
<body>
<div class="container">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="top-text">AKB48 19期生</div>
  <div class="name">花田 藍衣</div>
  <div class="bottom-text">
    学歴は？捜真女学校出身！<br>
    偏差値55の名門女子校＆テニス部出身
  </div>
</div>
</body>
</html>
