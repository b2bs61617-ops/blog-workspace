<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  font-family: 'Yu Gothic', 'Meiryo', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
}
.container {
  width: 1200px;
  height: 630px;
  background: #eef7f4;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 22px;
  overflow: hidden;
}
.blob1 {
  position: absolute;
  width: 730px;
  height: 730px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(165,214,167,0.75) 0%, rgba(128,203,196,0.6) 40%, transparent 70%);
  opacity: 0.6;
  right: -170px;
  top: -170px;
  filter: blur(58px);
}
.blob2 {
  position: absolute;
  width: 410px;
  height: 410px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(77,182,172,0.6) 0%, transparent 70%);
  opacity: 0.42;
  left: -85px;
  bottom: -85px;
  filter: blur(45px);
}
.blob3 {
  position: absolute;
  width: 260px;
  height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(178,223,219,0.65) 0%, transparent 70%);
  opacity: 0.5;
  left: 320px;
  top: -30px;
  filter: blur(32px);
}
.top-text {
  font-size: 36px;
  font-weight: 700;
  color: #3d3d3d;
  letter-spacing: 0.12em;
  z-index: 1;
}
.name {
  font-size: 112px;
  font-weight: 900;
  color: #1a1a1a;
  letter-spacing: 0.1em;
  z-index: 1;
  text-align: center;
  line-height: 1.05;
}
.bottom-text {
  font-size: 37px;
  font-weight: 700;
  color: #2d2d2d;
  letter-spacing: 0.04em;
  z-index: 1;
  text-align: center;
  line-height: 1.65;
}
</style>
</head>
<body>
<div class="container">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="top-text">AKB48 19期生</div>
  <div class="name">花田 藍衣</div>
  <div class="bottom-text">
    家族構成は？4人家族！<br>
    魚好きを育てた教育熱心な家庭環境とは？
  </div>
</div>
</body>
</html>
