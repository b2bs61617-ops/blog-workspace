<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden;
  font-family: 'Yu Gothic', 'Meiryo', 'Hiragino Kaku Gothic ProN', sans-serif; }
.container {
  width: 1200px; height: 630px;
  background: #f0f4f8;
  position: relative;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center; gap: 18px;
  overflow: hidden;
}
.blob1 {
  position: absolute; width: 750px; height: 750px; border-radius: 50%;
  background: radial-gradient(circle, rgba(99,179,237,0.7) 0%, rgba(129,140,248,0.5) 40%, transparent 70%);
  opacity: 0.6; right: -180px; top: -180px; filter: blur(58px);
}
.blob2 {
  position: absolute; width: 450px; height: 450px; border-radius: 50%;
  background: radial-gradient(circle, rgba(196,132,252,0.65) 0%, transparent 70%);
  opacity: 0.5; left: -100px; bottom: -100px; filter: blur(45px);
}
.blob3 {
  position: absolute; width: 300px; height: 300px; border-radius: 50%;
  background: radial-gradient(circle, rgba(52,211,153,0.45) 0%, transparent 70%);
  opacity: 0.4; left: 400px; bottom: -60px; filter: blur(40px);
}
.top-text { font-size: 34px; font-weight: 700; color: #374151; letter-spacing: 0.15em; z-index: 1; }
.name { font-size: 118px; font-weight: 900; color: #111827; letter-spacing: 0.06em; z-index: 1; text-align: center; line-height: 1.05; }
.bottom-text { font-size: 38px; font-weight: 700; color: #1f2937; letter-spacing: 0.05em; z-index: 1; text-align: center; line-height: 1.65; }
</style>
</head>
<body>
<div class="container">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="top-text">KO1KEYZ 1st ファンミーティング</div>
  <div class="name">コイキーズ</div>
  <div class="bottom-text">チケット倍率は約7倍！<br>当選確率を徹底分析</div>
</div>
</body>
</html>
